# ==========================================
# API GATEWAY CONFIGURATION
# ==========================================

server:
  port: 8090

spring:
  application:
    name: API-GATEWAY

  codec:
    max-in-memory-size: 100MB

  webflux:
    multipart:
      max-in-memory-size: 100MB
      max-disk-usage-per-part: 100MB

  cloud:
    gateway:
      httpclient:
        connect-timeout: 60000
        response-timeout: 600s
      
      # Route Definitions:
      # Each route directs traffic to a specific microservice identified by 'lb://SERVICE-NAME' (Eureka Discovery).
      # Routes using 'JwtFilter' require a valid Authorization header with a Bearer token.
      routes:
        # Auth Service: Handles login, registration, and profile management.
        - id: oauth2-auth
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/oauth2/**

        # OAuth2 Callback Route
        - id: oauth2-callback
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/login/oauth2/**

        # Auth Service Route
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
          filters:
            - JwtFilter

        # Post Service Route
        - id: post-service
          uri: lb://POST-SERVICE
          predicates:
            - Path=/posts/**
          filters:
            - JwtFilter

        # Reels Route
        - id: reels-service
          uri: lb://POST-SERVICE
          predicates:
            - Path=/reels/**
          filters:
            - JwtFilter

        # Reel Upload Files
        - id: reels-uploads
          uri: lb://POST-SERVICE
          predicates:
            - Path=/uploads/reels/**

        # Payment Service Webhook
        - id: payment-service-webhook
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payments/webhook

        # Payment Service
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payments/**
          filters:
            - JwtFilter

        # Comment Service
        - id: comment-service
          uri: lb://COMMENT-SERVICE
          predicates:
            - Path=/comments/**
          filters:
            - JwtFilter

        # Like Service
        - id: like-service
          uri: lb://LIKE-SERVICE
          predicates:
            - Path=/likes/**
          filters:
            - JwtFilter

        # Follow Service
        - id: follow-service
          uri: lb://FOLLOW-SERVICE
          predicates:
            - Path=/follows/**
          filters:
            - JwtFilter

        # Notification Service
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**
          filters:
            - JwtFilter
        
        # Media Service
        - id: media-service
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/media/**
          filters:
            - JwtFilter

        # Media Uploads
        - id: media-uploads
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/uploads/**

        # Search Service
        - id: search-service
          uri: lb://SEARCH-SERVICE
          predicates:
            - Path=/search/**
          filters:
            - JwtFilter

        # Report Service
        - id: report-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/reports/**
          filters:
            - JwtFilter

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:connectsphereprojectsecretkeyconnectsphereauthsecure123456}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /auth/v3/api-docs
      - name: Post Service
        url: /posts/v3/api-docs
      - name: Comment Service
        url: /comments/v3/api-docs
      - name: Like Service
        url: /likes/v3/api-docs
      - name: Follow Service
        url: /follows/v3/api-docs
      - name: Notification Service
        url: /notifications/v3/api-docs
      - name: Media Service
        url: /media/v3/api-docs
      - name: Search Service
        url: /search/v3/api-docs
      - name: Payment Service
        url: /payments/v3/api-docs
