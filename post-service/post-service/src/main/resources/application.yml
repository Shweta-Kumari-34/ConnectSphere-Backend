# ==========================================
# POST SERVICE CONFIGURATION
# ==========================================

server:
  port: 8082
  tomcat:
    max-swallow-size: 104857600
    max-http-form-post-size: 104857600

spring:
  application:
    name: POST-SERVICE
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/post_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
        retries: 0
    consumer:
      group-id: post-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Kafka is optional — app works without it
    listener:
      missing-topics-fatal: false

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      # Redis is optional — app works without it

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:connectsphereprojectsecretkeyconnectsphereauthsecure123456}

connectsphere:
  media-service:
    base-url: http://localhost:8092/media
  search-service:
    base-url: http://localhost:8088/search
  notification:
    exchange: notification.exchange
    routing-key: notification.created


# Actuator
management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
