# ========================================================
# GitHub Actions CI/CD Pipeline (Backend)
# ========================================================

name: ConnectSphere Backend CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q check_running"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn -B clean test -pl "!:eureka-server"
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/test_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          JWT_SECRET: connectsphere-test-secret-key-1234567890
          CONNECTSPHERE_INTERNAL_SECRET: test-internal-secret
          EUREKA_CLIENT_ENABLED: "false"
          SPRING_CLOUD_DISCOVERY_ENABLED: "false"
          GOOGLE_CLIENT_ID: "test-client-id"
          GOOGLE_CLIENT_SECRET: "test-client-secret"
          CLOUDINARY_CLOUD_NAME: "test-cloud"
          CLOUDINARY_API_KEY: "test-key"
          CLOUDINARY_API_SECRET: "test-secret"
          RAZORPAY_KEY_ID: "test-razor-id"
          RAZORPAY_KEY_SECRET: "test-razor-secret"
          MAIL_HEALTH_ENABLED: "false"

      - name: SonarQube Analysis
        continue-on-error: true
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar
          -Dsonar.organization=${{ github.repository_owner }}
          -Dsonar.projectKey=connectsphere-backend
          -Dsonar.projectName="ConnectSphere Backend"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-analyze
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            WORKSPACE="$HOME/connectsphere"
            mkdir -p $WORKSPACE
            cd $WORKSPACE

            sync_repo() {
              REPO_DIR="$1"
              REPO_URL="$2"

              if [ -d "$REPO_DIR/.git" ]; then
                git -C "$REPO_DIR" pull origin main
              else
                rm -rf "$REPO_DIR"
                git clone "$REPO_URL" "$REPO_DIR"
              fi
            }

            # Sync Backend Repository
            sync_repo "ConnectSphere-Backend" "https://github.com/Shweta-Kumari-34/ConnectSphere-Backend.git"

            # Sync Frontend Repository
            sync_repo "ConnectSphere-Frontend" "https://github.com/Shweta-Kumari-34/ConnectSphere-Frontend.git"

            test -f ConnectSphere-Frontend/Dockerfile

            # Orchestrate with Docker Compose
            cd ConnectSphere-Backend
            docker compose up -d --build
            echo "Deployment to Production Successful."
